# ?????????????????????????????????????????????????????????????????????????????
# Cucumber + JUnit 5 Parallel Execution Configuration
# ?????????????????????????????????????????????????????????????????????????????

# Enable parallel execution at the JUnit Platform level
junit.jupiter.execution.parallel.enabled=true

# Parallelism strategy:
#   fixed   ? exact thread count via 'fixed.parallelism'
#   dynamic ? computed from available processors * multiplier
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# Default execution mode
junit.jupiter.execution.parallel.mode.default=CONCURRENT
junit.jupiter.execution.parallel.mode.classes.default=CONCURRENT

# ?????????????????????????????????????????????????????????????????????????????
# Cucumber-specific parallel settings
# ?????????????????????????????????????????????????????????????????????????????

# Run scenarios in parallel (not just features)
cucumber.execution.parallel.enabled=true