# ?????????????????????????????????????????????????????????????????????????????
# Base Framework Configuration
# Override any property from CLI: -Dkey=value
# Switch environment:            -Denv=staging
# ?????????????????????????????????????????????????????????????????????????????

# Active environment ? loads environments/{env}.properties on top of this file
# Valid values: dev | staging | uat | prod
env=dev

# Browser
browser=chrome
headless=false

# Waits (seconds)
explicit.wait=10
page.load.timeout=30

# Retry (used by Feature 2)
retry.enabled=true
retry.count=2

# Base URL ? this is just a fallback. Real values live in environments/*.properties
base.url=https://www.google.com

# Credentials ? overridden per environment
app.username=default_user
app.password=default_pass